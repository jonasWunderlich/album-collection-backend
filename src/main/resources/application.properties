# Application configuration
quarkus.application.name=albums-backend

# HTTP port
quarkus.http.port=8090

# OpenAPI / Swagger UI (only enabled in dev/test mode by default)
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger-ui

# OpenAPI metadata
mp.openapi.extensions.smallrye.info.title=Albums API
mp.openapi.extensions.smallrye.info.version=1.0.0
mp.openapi.extensions.smallrye.info.description=Backend API for the HSS music collection

# Path to the albums JSON file.
# Leave empty to load from classpath (src/main/resources/albums.json).
# Override in production: albums.json.path=/absolute/path/to/albums.json
albums.json.path=
