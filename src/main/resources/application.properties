# Application configuration
quarkus.application.name=albums-backend

# HTTP port
quarkus.http.port=8080
quarkus.http.host=0.0.0.0

# CORS aktivieren
quarkus.http.cors.enabled=true

# Für die Entwicklung alle Origins zulassen (oder explizit z. B. http://localhost:4200)
quarkus.http.cors.origins=*

# Erlaubte Header & Methoden
quarkus.http.cors.headers=*
quarkus.http.cors.methods=GET, POST

# OpenAPI / Swagger UI (only enabled in dev/test mode by default)
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger-ui

# Schema beim Quarkus-Build als Datei exportieren
quarkus.smallrye-openapi.store-schema-directory=target/generated-docs
quarkus.smallrye-openapi.store-schema-file-name=openapi
quarkus.smallrye-openapi.servers=/

# OpenAPI metadata
mp.openapi.extensions.smallrye.info.title=Albums API
mp.openapi.extensions.smallrye.info.version=1.0.0
mp.openapi.extensions.smallrye.info.description=Backend API for the HSS music collection

# Path to the albums JSON file.
# Leave empty to load from classpath (src/main/resources/albums.json).
# Override in production: albums.json.path=/absolute/path/to/albums.json
quarkus.native.resources.includes=library.json,releaseYears.json
library.json.path=
releaseYears.json.path=
